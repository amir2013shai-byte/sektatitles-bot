<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Витрина коллекции</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b0d12; --card:#151a24; --card2:#1b2130; --text:#eaf0ff; --dim:#8b95ad;
    --accent:#6c8cff; --common:#9aa4b8; --rare:#5aa9ff; --epic:#b06cff;
    --legendary:#ffc247; --mythic:#ff5f6d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:radial-gradient(1200px 600px at 50% -10%,#1a2240 0%,var(--bg) 55%);
       color:var(--text);min-height:100vh;padding:16px 14px 40px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#2b3550,#3c4a72);
          display:grid;place-items:center;font-size:24px;flex:0 0 auto;
          box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .who{min-width:0}
  .name{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .uname{color:var(--dim);font-size:13px}
  .stats{display:flex;gap:10px;margin:14px 0 22px}
  .stat{flex:1;background:var(--card);border:1px solid #222a3a;border-radius:16px;padding:12px 14px}
  .stat .v{font-size:20px;font-weight:800}
  .stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
  .equipped{background:linear-gradient(135deg,#232d4a,#1a2136 60%,#241d3a);
            border:1px solid #33406b;border-radius:20px;padding:16px;margin-bottom:22px;
            display:flex;align-items:center;gap:14px}
  .equipped .big{font-size:40px;line-height:1}
  .equipped .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .equipped .ttl{font-size:20px;font-weight:800;margin-top:2px}
  .rarity{font-size:12px;color:var(--dim);margin-top:4px}
  h2{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{position:relative;background:var(--card);border:1px solid #232c3e;border-radius:18px;
        padding:14px;overflow:hidden;transition:transform .15s ease}
  .card:active{transform:scale(.97)}
  .card .emoji{font-size:30px;line-height:1}
  .card .tname{font-weight:700;margin-top:10px;font-size:15px}
  .card .r{font-size:11px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
  .card::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
               box-shadow:inset 0 0 0 1px transparent}
  .card.common{background:linear-gradient(180deg,#171c26,#141922)}
  .card.rare{border-color:#264a7a;background:linear-gradient(180deg,#152238,#131a28)}
  .card.epic{border-color:#4a2a7a;background:linear-gradient(180deg,#221636,#171226)}
  .card.legendary{border-color:#7a5a1f;background:linear-gradient(180deg,#2b2110,#1d160c)}
  .card.mythic{border-color:#7a2430;background:linear-gradient(180deg,#2c1218,#1d0e12)}
  .card.legendary .emoji,.card.mythic .emoji{filter:drop-shadow(0 0 10px rgba(255,190,80,.45))}
  .badge{position:absolute;top:10px;right:10px;font-size:10px;letter-spacing:.06em;
         padding:4px 8px;border-radius:999px;background:#0008;border:1px solid #ffffff22;color:#dbe4ff}
  .empty{color:var(--dim);font-size:14px;padding:20px 0}
  .foot{margin-top:26px;color:#5f6880;font-size:12px;text-align:center}
  .secret{display:none}
</style>
</head>
<body>
<div class="head">
  <div class="avatar">🎖</div>
  <div class="who">
    <div class="name" id="name">Загрузка…</div>
    <div class="uname" id="uname"></div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="v" id="coins">0</div><div class="k">Монеты</div></div>
  <div class="stat"><div class="v" id="count">0</div><div class="k">Титулов</div></div>
  <div class="stat"><div class="v" id="points">0</div><div class="k">Очки сезона</div></div>
</div>

<div id="equipped"></div>

<h2>Коллекция</h2>
<div class="grid" id="grid"></div>

<div class="foot">Витрина бота титулов · данные приходят из Telegram</div>

<script>
const RAR = {common:["обычный","⚪️"],rare:["редкий","🔵"],epic:["эпический","🟣"],
             legendary:["легендарный","🟡"],mythic:["мифический","🔴"]};

function decodePayload(){
  const hash = location.hash || "";
  const m = hash.match(/showcase=([A-Za-z0-9_-]+)/);
  if(!m) return null;
  try{
    let b64 = m[1].replace(/-/g,"+").replace(/_/g,"/");
    while(b64.length % 4) b64 += "=";
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const json = new TextDecoder("utf-8").decode(bytes);
    return JSON.parse(json);
  }catch(e){ console.error(e); return null; }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(data){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0b0d12"); }
  if(!data){
    document.getElementById("name").textContent = "Нет данных";
    document.getElementById("grid").innerHTML =
      '<div class="empty">Откройте витрину из бота: команда /showcase</div>';
    return;
  }
  document.getElementById("name").textContent = data.name || data.uname || "Игрок";
  document.getElementById("uname").textContent = data.uname ? "@" + data.uname : "";
  document.getElementById("coins").textContent = data.coins ?? 0;
  document.getElementById("count").textContent = (data.titles || []).length;
  document.getElementById("points").textContent = data.points ?? 0;

  const eq = document.getElementById("equipped");
  if(data.equipped){
    const r = RAR[data.equipped.rarity] || ["", ""];
    eq.innerHTML = '<div class="equipped"><div class="big">' + esc(data.equipped.emoji) +
      '</div><div><div class="lbl">Надет титул</div><div class="ttl">' + esc(data.equipped.name) +
      '</div><div class="rarity">' + r[1] + " " + r[0] + '</div></div></div>';
  }

  const grid = document.getElementById("grid");
  const titles = (data.titles || []).slice().sort((a,b) => {
    const order = Object.keys(RAR);
    return order.indexOf(b.r) - order.indexOf(a.r);
  });
  if(!titles.length){
    grid.innerHTML = '<div class="empty">Коллекция пока пуста — загляните в /shop</div>';
    return;
  }
  grid.innerHTML = titles.map(t => {
    const r = RAR[t.r] || ["", ""];
    const style = data.style && data.equipped ? "" : "";
    return '<div class="card ' + esc(t.r) + '"' + style + '>' +
      '<div class="badge">' + r[1] + '</div>' +
      '<div class="emoji">' + esc(t.e) + '</div>' +
      '<div class="tname">' + esc(t.n) + '</div>' +
      '<div class="r">' + esc(r[0]) + '</div>' +
    '</div>';
  }).join("");
}

render(decodePayload());
window.addEventListener("hashchange", () => render(decodePayload()));
</script>
</body>
</html>
